<div class="container">
  <div class="row">
    <div class="col s5">
      <div class="card">
        <div class="card-content">
          <span class="card-title">
            {{ empleadoService.selectedEmpleado._id ? 'Editar empleado' : 'Nuevo empleado' }}
          </span>
          <form #empleadoForm="ngForm" (ngSubmit)="guardarEmpleado(empleadoForm)">
            <div class="row">
              <div class="input-field col s12">
                <input type="text" name="name" [(ngModel)]="empleadoService.selectedEmpleado.name" placeholder="Ingrese su nombre">
              </div>
              <div class="input-field col s12">
                <input type="text" name="correo" [(ngModel)]="empleadoService.selectedEmpleado.correo" placeholder="Ingrese su correo">
              </div>
              <div class="card-action">
                <div class="input-field col s12">
                  <button class="btn right" type="button" (click)="resetForm(empleadoForm)">Limpiar</button>
                  <button class="btn" type="submit">
                    {{ empleadoService.selectedEmpleado._id ? 'Actualizar' : 'Guardar' }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col s7">
      <table class="striped">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let empleado of empleadoService.empleados">
            <td>{{ empleado.name }}</td>
            <td>{{ empleado.correo }}</td>
            <td>
              <button class="btn-floating btn-small" type="button" title="Editar" (click)="editarEmpleado(empleado)">
                <i class="material-icons">edit</i>
              </button>
              <button class="btn-floating btn-small red" type="button" title="Eliminar" (click)="eliminarEmpleado(empleado._id)">
                <i class="material-icons">delete</i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
